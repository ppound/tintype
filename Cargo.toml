[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# Internal crates. Layering is enforced by `cargo xtask layers`.
tintype-meta = { path = "crates/meta" }
tintype-codecs = { path = "crates/codecs" }
tintype-infer = { path = "crates/infer" }
tintype-catalog = { path = "crates/catalog" }
tintype-index = { path = "crates/index" }
tintype-analyze = { path = "crates/analyze" }
tintype-faces = { path = "crates/faces" }
tintype-jobs = { path = "crates/jobs" }
tintype-engine = { path = "crates/engine" }
tintype-testkit = { path = "crates/testkit" }
tintype-ui-egui = { path = "crates/ui-egui" }

# External.
anyhow = "1"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
crossbeam-channel = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
eframe = { version = "0.37", features = ["persistence"] }
dunce = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
imagesize = "0.15"
jpeg-decoder = { version = "0.3", default-features = false }
mimalloc = "0.1"
kamadak-exif = "0.6"
quick-xml = "0.41"
rayon = "1.12"
rfd = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.27"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tract-onnx = "0.23"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
walkdir = "2.5"

[profile.dev.package."*"]
# Dependencies (sqlite, tantivy, exif parsing) are slow unoptimized; our own code stays debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
